# Display name of the workflow shown in the GitHub Actions tab
name: Trip Planner CI

# Triggers: tells GitHub WHEN to automatically start this pipeline
on:
  push:
    branches: [ main ]        # Run whenever new commits are pushed to main
  pull_request:
    branches: [ main ]        # Run whenever a Pull Request targets main

# Jobs: a pipeline consists of one or more jobs that execute in parallel or sequence
jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest    # Spin up a fresh Ubuntu Linux virtual machine in the cloud

    # Steps: individual tasks executed in strict top-to-bottom order inside the Ubuntu VM
    steps:
      # Step 1: Clone this GitHub repository onto the empty Ubuntu machine
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install Node.js v20 and cache npm packages to speed up future runs
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: Clean Install exact package versions from package-lock.json
      - name: Install dependencies
        run: npm ci

      # Step 4: Run the test suite with mock environment variables
      # Because .env is in .gitignore, GitHub Actions does not have your local .env file.
      # Passing dummy values here prevents Passport/Asgardeo from crashing on startup
      # without exposing your real production API keys.
      - name: Run test suite
        env:
          NODE_ENV: test
          SESSION_SECRET: ci-dummy-session-secret-key-32chars
          ASGARDEO_CLIENT_ID: dummy-client-id
          ASGARDEO_CLIENT_SECRET: dummy-client-secret
          ASGARDEO_BASE_URL: https://api.asgardeo.io/t/dummy
          ASGARDEO_CALLBACK_URL: http://localhost:5000/auth/callback
          GEMINI_API_KEY: dummy-gemini-key
        run: npm test