name: Trip Planner CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Continuous Integration (Test the code)
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        env:
          NODE_ENV: test
          SESSION_SECRET: ci-dummy-session-secret-key-32chars
          ASGARDEO_CLIENT_ID: dummy-client-id
          ASGARDEO_CLIENT_SECRET: dummy-client-secret
          ASGARDEO_BASE_URL: https://api.asgardeo.io/t/dummy
          ASGARDEO_CALLBACK_URL: http://localhost:5000/auth/callback
          GEMINI_API_KEY: dummy-gemini-key
        run: npm test

  # Job 2: Continuous Deployment (Ship to Vercel ONLY if Job 1 passes)
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: test                                                    # Gate: block deployment if tests fail
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'  # Only deploy direct pushes to main

    steps:
      - name: Trigger Vercel Production Deployment
        run: curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"